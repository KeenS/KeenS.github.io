# みんな…
---------------

* 正規表現使ってる？
* パーサ使ってる？
  + yaccとか

===
# なんで？
----------

* CFGはRegexの上位互換
  + 正規言語 ⊂ 文脈自由言語
* 全部CFGでよくない？

===
# なぜ使われない？
---------------

* APIが違う
  + 文字列 vs トークン列
  + `match`, `find`, `capture`, …
  + マッチ位置 vs AST構築
* ツールが違う
  + プログラム内vsコードジェネレータ

===
# パーサを便利にしたい
-------------------------

* Regexの手法を取り入れられない？
* API真似したい
  + 文字列受け取りたい
  +  `match`, `find`, `capture`
  + マッチ位置だけあればいい
* ツール真似したい
  * プログラム内で動かしたい

===
# 作ってる
--------

[KeenS/regext](https://github.com/KeenS/regext)
(まだプロトタイプ)

===
# 使い方
-------

```rs
use RegExt::Regex;

let re = Regex::new("a(b)+c").unwrap();
assert!(re.is_match("abbbc"));
```

===

```
let sign = Pattern::lit("+")
    .or(Pattern::lit("-"));
let re = Regex::from_pattern(
    sign.opt()
        .then(Pattern::digit()
        .between(1, 3))
    ).unwrap();

```

===

```rs
CfgParser::new(r#"S -> "(" S ")" | "a""#).unwrap();
parser.is_match("((a))")
```

===
# 他にも…
---------
